<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Availability</title>
<style>
  :root {
    --ink: #1c2430; --muted: #6b7480; --line: #dfe3e8; --paper: #ffffff;
    --open: #1f6f43; --open-soft: #e6f2ea; --taken: #e4e7eb;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .intro { color: var(--muted); margin: 0 0 24px; font-size: 15px; }
  h2 { font-size: 17px; font-weight: 600; margin: 28px 0 8px; padding-bottom: 6px;
    border-bottom: 2px solid var(--ink); }
  .empty { color: var(--muted); padding: 12px 0; }
  .event { display: grid; grid-template-columns: 56px 1fr; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--line); }
  .event.same-day { padding-top: 0; border-top: 0; }
  .event.same-day .day { visibility: hidden; }
  .day { text-align: center; line-height: 1.1; }
  .day .num { display: block; font-size: 26px; font-weight: 600; }
  .day .dow { display: block; font-size: 12px; color: var(--muted); }
  .title { font-weight: 600; }
  .type { color: var(--muted); font-size: 14px; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .slot { border-radius: 999px; padding: 7px 14px; font-size: 14px; border: 1.5px solid transparent;
    font-family: inherit; line-height: 1.2; }
  button.slot.open { background: var(--open-soft); border-color: var(--open); color: var(--open); cursor: pointer; }
  button.slot.open:hover, button.slot.open:focus-visible { background: var(--open); color: #fff; outline: none; }
  .slot.taken { background: var(--taken); color: var(--muted); }
  .not-going { color: var(--muted); font-size: 14px; margin-top: 6px; font-style: italic; }
  dialog { border: 0; border-radius: 12px; padding: 20px; width: min(92vw, 360px);
    box-shadow: 0 12px 40px rgba(28,36,48,.25); }
  dialog::backdrop { background: rgba(28,36,48,.4); }
  dialog p { margin: 0 0 12px; }
  dialog .ctx { color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 14px; margin-bottom: 6px; }
  input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; }
  input[type=text]:focus { outline: none; border-color: var(--ink); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .btn { font: inherit; padding: 9px 16px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper); cursor: pointer; }
  .btn.primary { background: var(--open); border-color: var(--open); color: #fff; }
  .btn:disabled { opacity: .6; cursor: default; }
  .error { color: #a3261f; font-size: 14px; margin-top: 8px; min-height: 1.2em; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* Skeleton placeholders shown until the schedule arrives */
  .sk { background: linear-gradient(90deg, #eceef1 25%, #f6f7f9 50%, #eceef1 75%);
    background-size: 200% 100%; animation: shimmer 1.2s ease-in-out infinite; border-radius: 6px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .sk-day { width: 30px; height: 26px; margin: 0 auto 4px; }
  .sk-dow { width: 24px; height: 10px; margin: 0 auto; }
  .sk-title { width: 55%; height: 15px; margin-bottom: 8px; }
  .sk-type { width: 30%; height: 12px; margin-bottom: 10px; }
  .sk-slot { width: 62px; height: 30px; border-radius: 999px; }
  /* Entrance animations */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  main > h1, main > .intro { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
  main > .intro { animation-delay: .08s; }
  #schedule > h2 { animation: fadein .35s ease both; }
  #schedule > .event { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
  /* Each row starts a little after the previous one; --i is set in JS. */
  #schedule > * { animation-delay: calc(.12s + var(--i, 0) * 45ms); }
  .stale { color: var(--muted); font-size: 12px; margin-top: -16px; margin-bottom: 16px; min-height: 1.2em; }
  @media (prefers-reduced-motion: reduce) { .sk, main > h1, main > .intro, #schedule > * { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Availability</h1>
  <p class="intro">Tap an open slot to claim it. You'll be asked for your name.</p>
  <div id="status" class="stale"></div>
  <div id="schedule"></div>
</main>

<dialog id="claimDialog">
  <p id="claimCtx" class="ctx"></p>
  <label for="nameInput">Your name</label>
  <input id="nameInput" type="text" maxlength="60" autocomplete="name">
  <div id="claimError" class="error"></div>
  <div class="actions">
    <button class="btn" id="cancelBtn" type="button">Cancel</button>
    <button class="btn primary" id="claimBtn" type="button">Claim slot</button>
  </div>
</dialog>
<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script>
  const { API_URL } = window.SCHEDULER_CONFIG || {};

  const MONTHS = ['January','February','March','April','May','June','July','August',
                  'September','October','November','December'];
  const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const $ = id => document.getElementById(id);
  const dialog = $('claimDialog');
  let pending = null;

  async function api(body) {
    // No custom headers: keeps the request "simple", so Apps Script needs no CORS preflight.
    const r = body
      ? await fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify(body) })
      : await fetch(API_URL + '?api=schedule', { redirect: 'follow' });
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    return data;
  }

  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const monthLabel = ym => MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
  function dateParts(d) {
    const [y, m, day] = d.split('-').map(Number);
    return { num: day, dow: DOWS[new Date(y, m - 1, day).getDay()] };
  }

  function render(data) {
    let html = '';
    data.months.forEach(ym => {
      html += `<h2>${monthLabel(ym)}</h2>`;
      const evs = data.events.filter(e => e.date.startsWith(ym));
      if (!evs.length) { html += '<div class="empty">Nothing scheduled.</div>'; return; }
      let prevDate = null;
      evs.forEach(ev => {
        const p = dateParts(ev.date);
        const sameDay = ev.date === prevDate;
        prevDate = ev.date;
        const slots = !ev.available
          ? '<div class="not-going">Not going</div>'
          : '<div class="slots">' + ev.slots.map(s => s.claimed
              ? `<span class="slot taken">Claimed</span>`
              : `<button class="slot open" type="button" data-event="${esc(ev.id)}" data-slot="${s.index}" aria-label="Claim slot ${s.index + 1} for ${esc(ev.title)}">Open</button>`
            ).join('') + '</div>';
        html += `
          <div class="event${sameDay ? ' same-day' : ''}">
            <div class="day"><span class="num">${p.num}</span><span class="dow">${p.dow}</span></div>
            <div>
              <div class="title">${esc(ev.title)}</div>
              <div class="type">${esc(ev.type)}</div>
              ${slots}
            </div>
          </div>`;
      });
    });
    const el = $('schedule');
    el.className = '';
    el.innerHTML = html;
    stagger(el);
  }

  // Give each heading/row an index so the CSS can stagger the fly-in (capped so
  // long lists don't take forever to settle).
  function stagger(el) {
    Array.from(el.children).forEach((c, i) => c.style.setProperty('--i', Math.min(i, 12)));
  }

  function showError(msg) { $('schedule').className = 'empty'; $('schedule').textContent = msg; }

  // --- Perceived speed: skeleton + last-known snapshot ------------------------
  const SNAP_KEY = 'schedule-snapshot';
  const MONTHS_GUESS = 4; // only for the skeleton; real months come from the server

  function skeleton() {
    const now = new Date();
    let html = '';
    for (let i = 0; i < MONTHS_GUESS; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
      html += `<h2>${MONTHS[d.getMonth()]} ${d.getFullYear()}</h2>`;
      for (let r = 0; r < (i === 0 ? 2 : 1); r++) {
        html += `
          <div class="event" aria-hidden="true">
            <div class="day"><div class="sk sk-day"></div><div class="sk sk-dow"></div></div>
            <div>
              <div class="sk sk-title"></div>
              <div class="sk sk-type"></div>
              <div class="slots"><div class="sk sk-slot"></div><div class="sk sk-slot"></div></div>
            </div>
          </div>`;
      }
    }
    $('schedule').innerHTML = html;
    stagger($('schedule'));
  }

  function readSnapshot() {
    try {
      const raw = localStorage.getItem(SNAP_KEY);
      if (!raw) return null;
      const snap = JSON.parse(raw);
      // Ignore anything older than a week; it would mostly be past events.
      return (Date.now() - snap.at < 7 * 864e5) ? snap.data : null;
    } catch (e) { return null; }
  }
  function writeSnapshot(data) {
    try { localStorage.setItem(SNAP_KEY, JSON.stringify({ at: Date.now(), data })); } catch (e) {}
  }

  function renderFresh(data) {
    writeSnapshot(data);
    render(data);
    $('status').textContent = '';
  }

  function load() {
    api().then(renderFresh).catch(() => {
      if (readSnapshot()) $('status').textContent = "Couldn't refresh — showing the last known schedule.";
      else showError('Could not load the schedule. Refresh to try again.');
    });
  }

  function boot() {
    const snap = readSnapshot();
    if (snap) { render(snap); $('status').textContent = 'Updating…'; }
    else skeleton();
    load();
  }
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  $('schedule').addEventListener('click', e => {
    const btn = e.target.closest('button.slot.open');
    if (!btn) return;
    pending = { eventId: btn.dataset.event, slotIndex: +btn.dataset.slot };
    const ev = btn.closest('.event');
    $('claimCtx').textContent = ev.querySelector('.title').textContent + ' — slot ' + (pending.slotIndex + 1);
    $('claimError').textContent = '';
    $('claimBtn').disabled = false;
    dialog.showModal();
    $('nameInput').focus();
  });
  $('cancelBtn').addEventListener('click', () => dialog.close());
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('claimBtn').click(); });
  $('claimBtn').addEventListener('click', () => {
    const name = $('nameInput').value.trim();
    if (!name) { $('claimError').textContent = 'Enter your name to claim a slot.'; return; }
    $('claimBtn').disabled = true;
    $('claimError').textContent = '';
    api({ action: 'claim', eventId: pending.eventId, slotIndex: pending.slotIndex, name })
      .then(data => { dialog.close(); renderFresh(data); toast('Slot claimed'); })
      .catch(err => {
        $('claimBtn').disabled = false;
        $('claimError').textContent = err.message || 'Could not claim that slot.';
        load();
      });
  });

  boot();
</script>
</body>
</html>
